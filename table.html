<!DOCTYPE html>
<html>

<head>
    <title>Table</title>
    <style>
        body{
            padding: 10px;
            text-align: center;
        }
        table{
            border: 1px solid black;

            border-collapse: collapse;
        }
        td,th{
            padding: 3px;
            border: 1px solid black;
        }
       
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Ocean</th>
                <th>Average Depth</th>
                <th>Maximum Depth</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pacific Ocean</td>
                <td>4280 m</td>
                <td>10,911 m</td>
            </tr>
            <tr>
                <td>Atlantic Ocean</td>
                <td>3646 m</td>
                <td>8,486 m</td>
                
            </tr>
        </tbody>
    </table>
</body>

</html>
