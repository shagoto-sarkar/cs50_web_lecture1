<!DOCTYPE html>
<html>  
    <head>
        <title>Lists</title>
    </head>
    <body>
        An Undordered List:
        <ul>
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
        </ul>
        An Orderd List:
        <ol>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
        </ol>
    </body>

</html>
